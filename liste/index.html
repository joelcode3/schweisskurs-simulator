<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>hüfte hinten links</title>
<meta name="theme-color" content="#fafaf8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#131416" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="hüfte">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest?v=20261019-1">
<link rel="apple-touch-icon" href="icon-180.png?v=20261019-1">
<link rel="icon" type="image/png" href="icon-192.png?v=20261019-1">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;800&family=Source+Sans+3:wght@400;600&display=swap">
<style>
/* Layout: eine schmale Spalte, Kopf mit Logo und Titel, zwei Reiter, darunter eine schlichte Liste. */
:root {
  --bg: #fafaf8;
  --fg: #17191c;
  --muted: #6b7076;
  --line: #e3e4e1;
  --accent: #f0a514;
  --check: #2f7d4a;
  --kopf: #efefed;
  --warn: #b45309;
  --f-head: "Archivo", "Helvetica Neue", Arial, sans-serif;
  --f-body: "Source Sans 3", "Segoe UI", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --bg: #131416; --fg: #ecedee; --muted: #9a9fa5; --line: #2a2c30; --accent: #f5b52e; --check: #5cb27a; --warn: #f0a35a; --kopf: #1e1f22; color-scheme: dark; }
}
:root[data-theme="dark"] { --kopf: #1e1f22; --bg: #131416; --fg: #ecedee; --muted: #9a9fa5; --line: #2a2c30; --accent: #f5b52e; --check: #5cb27a; --warn: #f0a35a; color-scheme: dark; }
* { box-sizing: border-box; }
html { overflow-y: scroll; scrollbar-gutter: stable; }
body { background: var(--bg); color: var(--fg); font-family: var(--f-body); font-size: 17px; line-height: 1.45; }
.wrap { max-width: 680px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

header .wrap { padding-block: 36px 24px; }
.marke { display: flex; align-items: flex-end; gap: 8px; border-bottom: 4px solid var(--accent); width: 100%; }
h1 { font-family: var(--f-head); font-weight: 800; font-size: clamp(40px, 11vw, 88px); display: flex; align-items: baseline; white-space: nowrap; line-height: 1; letter-spacing: -1.5px; margin: 0 0 -0.04em; }
h1 .bald { font-family: var(--f-body); font-size: 0.2em; font-weight: 400; letter-spacing: 0.5px; color: var(--muted); margin-left: 0.9em; white-space: nowrap; }
.ecke { display: flex; align-items: flex-end; align-self: stretch; flex: none; margin-left: auto; border-right: 4px solid var(--accent); }
.figur { display: block; height: clamp(96px, 26vw, 192px); width: auto; }
header p { margin: 10px 0 0; color: var(--muted); font-family: var(--f-head); font-weight: 500; font-size: 13px; letter-spacing: 2px; text-transform: uppercase; }

nav .wrap { display: flex; gap: 22px; overflow-x: auto; scrollbar-width: none; border-bottom: 1px solid var(--line); }
nav button { appearance: none; border: 0; background: none; color: var(--muted); font: 700 16px var(--f-head); padding: 10px 0 12px; margin-bottom: -1px; border-bottom: 2px solid transparent; cursor: pointer; }
nav button[aria-selected="true"] { color: var(--fg); border-bottom-color: var(--accent); }
button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }

main .wrap { padding-block: 8px 64px; }
ul.liste { list-style: none; margin: 0; padding: 0; }
ul.liste li { display: flex; align-items: center; gap: 12px; padding: 14px 0; border-bottom: 1px solid var(--line); }
ul.liste li.erledigt .text { color: var(--muted); text-decoration: line-through; }
ul.liste li .text { cursor: text; }
.textbox { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px; }
.textbox .text { overflow-wrap: anywhere; }
.warnung { color: var(--warn); font-size: 14px; text-decoration: none; }
.warnung::before { content: "Noch nicht erledigt: "; font-weight: 600; }
ul.liste li.erledigt .warnung { color: var(--warn); }
input.edit { flex: 1; min-width: 0; font: 17px var(--f-body); color: var(--fg); background: transparent; border: 0; border-bottom: 2px solid var(--accent); padding: 2px 0; outline: none; }
.loeschen { appearance: none; flex: none; width: 28px; height: 28px; border: 0; background: transparent; color: var(--muted); opacity: .55; display: grid; place-items: center; cursor: pointer; padding: 0; border-radius: 6px; }
.loeschen:hover { opacity: 1; }
.loeschen.scharf { opacity: 1; color: #fff; background: #c0392b; }
.loeschen svg { width: 17px; height: 17px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

.haken { appearance: none; flex: none; width: 24px; height: 24px; margin: 0; border: 2px solid var(--muted); border-radius: 5px; background: transparent; cursor: pointer; display: grid; place-items: center; }
.haken:checked { background: var(--check); border-color: var(--check); }
.haken:checked::after { content: ""; width: 6px; height: 12px; border: solid #fff; border-width: 0 2.5px 2.5px 0; transform: translateY(-1px) rotate(45deg); }
.leer { color: var(--muted); padding: 14px 0; }
form.neu { display: flex; align-items: center; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--line); }
form.neu button { appearance: none; flex: none; width: 28px; height: 28px; border: 0; border-radius: 50%; background: var(--accent); color: #fff; display: grid; place-items: center; cursor: pointer; padding: 0; }
form.neu button svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 2.5; stroke-linecap: round; }
form.neu input { flex: 1; min-width: 0; border: 0; background: transparent; color: var(--fg); font: 17px var(--f-body); padding: 6px 0; }
form.neu input::placeholder { color: var(--muted); }
form.neu input:focus-visible { outline: none; }
form.neu:focus-within { border-bottom-color: var(--accent); }
h1.drei { display: block; white-space: nowrap; font-size: clamp(24px, 6.2vw, 46px); line-height: 1; margin-bottom: 0.02em; }
h1 .unter { font-size: 0.42em; color: var(--fg); letter-spacing: -0.3px; margin-left: 0.15em; }
h1 .rot { color: var(--accent); }
html { background: var(--bg); }
body { margin: 0; -webkit-text-size-adjust: 100%; }
:root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
[hidden] { display: none !important; }
img { max-width: 100%; }
#hinweis { color: var(--warn); }
#tor { position: fixed; inset: 0; z-index: 20; background: var(--bg); display: grid; place-items: center; padding: 24px; }
#tor-form { display: grid; gap: 10px; width: min(320px, 100%); }
.tor-titel { font-family: var(--f-head); font-weight: 800; font-size: 34px; line-height: 1; color: var(--accent); margin: 0 0 14px; letter-spacing: -0.5px; }
#tor-form label { color: var(--muted); font-size: 14px; }
#tor-code { font: 22px var(--f-body); letter-spacing: 4px; padding: 10px 12px; border: 2px solid var(--line); border-radius: 8px; background: transparent; color: var(--fg); }
#tor-code:focus { outline: none; border-color: var(--accent); }
#tor-form button { font: 700 17px var(--f-head); padding: 12px; border: 0; border-radius: 8px; background: var(--accent); color: #fff; cursor: pointer; }
#tor-fehler { color: var(--warn); margin: 0; }
</style>
</head>
<body>
<header>
  <div class="wrap">
    <div class="marke">
      <h1 class="drei"><span class="rot">hüfte hinten links</span> <span class="unter">das spiel</span></h1>
      <span class="ecke"><img class="figur" src="dennis.webp?v=20261019-1" alt=""></span>
    </div>
    <p>Projektmanagement</p>
  </div>
</header>

<nav>
  <div class="wrap" role="tablist">
    <button role="tab" id="tab-todo" aria-selected="true" data-ziel="todos">To-Dos</button>
    <button role="tab" id="tab-ideen" aria-selected="false" data-ziel="ideen">Ideen</button>
    <button role="tab" id="tab-utopie" aria-selected="false" data-ziel="utopie">Utopisch (noch)</button>
    <button role="tab" id="tab-bugs" aria-selected="false" data-ziel="bugs">Bugs</button>
  </div>
</nav>

<main>
  <div class="wrap">
    <p class="leer" id="hinweis" hidden></p>
    <div id="bereich-todos">
      <form class="neu" data-art="todo" autocomplete="off"><button type="submit" aria-label="To-Do hinzufügen"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button><input type="text" id="neu-todo" placeholder="Neues To-Do" aria-label="Neues To-Do"></form>
      <ul class="liste" id="todos"><li class="leer">To-Dos werden geladen.</li></ul>
    </div>
    <div id="bereich-ideen" hidden>
      <form class="neu" data-art="idee" autocomplete="off"><button type="submit" aria-label="Idee hinzufügen"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button><input type="text" id="neu-idee" placeholder="Neue Idee" aria-label="Neue Idee"></form>
      <ul class="liste" id="ideen"><li class="leer">Ideen werden geladen.</li></ul>
    </div>
    <div id="bereich-bugs" hidden>
      <form class="neu" data-art="bug" autocomplete="off"><button type="submit" aria-label="Bug hinzufügen"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button><input type="text" id="neu-bug" placeholder="Neuer Bug" aria-label="Neuer Bug"></form>
      <ul class="liste" id="bugs"><li class="leer">Wird geladen.</li></ul>
    </div>
    <div id="bereich-utopie" hidden>
      <form class="neu" data-art="utopie" autocomplete="off"><button type="submit" aria-label="Utopische Idee hinzufügen"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button><input type="text" id="neu-utopie" placeholder="Neue utopische Idee" aria-label="Neue utopische Idee"></form>
      <ul class="liste ideenliste" id="utopie"><li class="leer">Wird geladen.</li></ul>
    </div>
  </div>
</main>


<div id="tor" hidden>
  <form id="tor-form" autocomplete="off">
    <p class="tor-titel">hüfte hinten links</p>
    <label for="tor-code">Code eingeben</label>
    <input id="tor-code" type="password" inputmode="numeric" autocomplete="off">
    <button type="submit">Rein</button>
    <p id="tor-fehler" hidden></p>
  </form>
</div>

<script>
(function () {
  // Supabase (Campingplatz-Projekt, nur die Tabelle asmus_eintraege über Funktionen mit Code)
  const SB_URL = "https://erobbkjhfauwvzfegeiw.supabase.co";
  const SB_KEY = "sb_publishable_NQ2Q9efPtjrLHr6pEB4ygg_vE4Vnp-S";
  let eintraege = [], code = "", schreiben = true;

  async function rpc(fn, args) {
    const r = await fetch(SB_URL + "/rest/v1/rpc/" + fn, {
      method: "POST",
      headers: { apikey: SB_KEY, Authorization: "Bearer " + SB_KEY, "Content-Type": "application/json" },
      body: JSON.stringify(Object.assign({ p_code: code }, args || {}))
    });
    const text = await r.text();
    if (!r.ok) { const e = new Error(text); e.status = r.status; e.falscherCode = /falscher Code/.test(text); throw e; }
    return text ? JSON.parse(text) : null;
  }

  function hinweis(t) {
    const h = document.getElementById("hinweis");
    h.textContent = t || ""; h.hidden = !t;
  }

  const tabs = document.querySelectorAll("nav button");
  function zeige(ziel) {
    tabs.forEach(b => b.setAttribute("aria-selected", b.dataset.ziel === ziel ? "true" : "false"));
    ["todos", "ideen", "utopie", "bugs"].forEach(z => document.getElementById("bereich-" + z).hidden = z !== ziel);
    try { localStorage.setItem("asmus-reiter", ziel); } catch (e) {}
  }
  tabs.forEach(b => b.addEventListener("click", () => zeige(b.dataset.ziel)));
  try { const r = location.hash.slice(1) || localStorage.getItem("asmus-reiter"); if (["todos", "ideen", "utopie", "bugs"].includes(r)) zeige(r); } catch (e) {}

  const reihe = (a, b) => (a.reihe || 999) - (b.reihe || 999) || String(a.erstellt || "").localeCompare(String(b.erstellt || ""));
  const neuesteZuerst = (a, b) => String(b.erledigt_am || "").localeCompare(String(a.erledigt_am || ""));

  const MUELL = '<svg viewBox="0 0 24 24"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg>';

  function zeile(x, mitHaken) {
    const li = document.createElement("li");
    if (mitHaken && x.status === "erledigt") li.className = "erledigt";
    const s = document.createElement("span"); s.textContent = x.titel || ""; s.className = "text";
    s.title = "Zum Bearbeiten antippen";
    s.addEventListener("click", () => bearbeiten(s, x));
    const box = document.createElement("div"); box.className = "textbox"; box.appendChild(s);
    if (mitHaken && x.status === "erledigt" && x.warnung) {
      const w = document.createElement("div"); w.className = "warnung"; w.textContent = x.warnung; box.appendChild(w);
    }
    li.appendChild(box);
    if (mitHaken) {
      const h = document.createElement("input");
      h.type = "checkbox"; h.className = "haken"; h.checked = x.status === "erledigt"; h.disabled = !schreiben;
      h.setAttribute("aria-label", "Erledigt: " + (x.titel || ""));
      h.addEventListener("change", () => {
        const fertig = h.checked;
        x.status = fertig ? "erledigt" : "offen"; x.erledigt_am = fertig ? new Date().toISOString().slice(0, 10) : null;
        render();
        speichern(x.id, { status: x.status, erledigt_am: x.erledigt_am });
      });
      li.appendChild(h);
    }
    const m = document.createElement("button");
    m.type = "button"; m.className = "loeschen"; m.innerHTML = MUELL; m.setAttribute("aria-label", "Löschen: " + (x.titel || "")); m.title = "Löschen";
    m.hidden = !schreiben;
    let scharf = false, t = null;
    m.addEventListener("click", async () => {
      if (!scharf) { scharf = true; m.classList.add("scharf"); m.title = "Nochmal tippen zum Löschen"; t = setTimeout(() => { scharf = false; m.classList.remove("scharf"); m.title = "Löschen"; }, 3000); return; }
      clearTimeout(t);
      eintraege = eintraege.filter(e => e.id !== x.id); render();
      try { await rpc("asmus_loeschen", { p_id: x.id }); } catch (e) { fehler(e); }
    });
    li.appendChild(m);
    return li;
  }

  let editiert = false, offenesRender = false;
  function bearbeiten(s, x) {
    if (!schreiben || editiert) return;
    editiert = true;
    const f = document.createElement("input");
    f.type = "text"; f.className = "edit"; f.value = x.titel || ""; f.maxLength = 500; f.setAttribute("aria-label", "Text bearbeiten");
    s.replaceWith(f); f.focus(); f.setSelectionRange(f.value.length, f.value.length);
    let fertig = false;
    const ende = async (sichern) => {
      if (fertig) return; fertig = true; editiert = false;
      const neu = f.value.trim();
      f.replaceWith(s);
      if (sichern && neu && neu !== x.titel) { x.titel = neu; s.textContent = neu; await speichern(x.id, { titel: neu }); }
      if (offenesRender) { offenesRender = false; render(); }
    };
    f.addEventListener("keydown", e => { if (e.key === "Enter") { e.preventDefault(); ende(true); } if (e.key === "Escape") ende(false); });
    f.addEventListener("blur", () => ende(true));
  }

  function liste(art, ziel, mitHaken, leerText) {
    const ul = document.getElementById(ziel); ul.textContent = "";
    const alle = eintraege.filter(x => x.art === art);
    const offen = alle.filter(x => !mitHaken || x.status !== "erledigt").sort(reihe);
    const fertig = mitHaken ? alle.filter(x => x.status === "erledigt").sort(neuesteZuerst) : [];
    offen.concat(fertig).forEach(x => ul.appendChild(zeile(x, mitHaken)));
    if (!alle.length) ul.innerHTML = '<li class="leer">' + leerText + '</li>';
  }

  function render() {
    if (editiert) { offenesRender = true; return; }
    liste("todo", "todos", true, "Keine To-Dos.");
    liste("idee", "ideen", true, "Noch keine Ideen.");
    liste("utopie", "utopie", false, "Noch nichts Utopisches. Oben mit + eintragen.");
    liste("bug", "bugs", true, "Keine Bugs gemeldet.");
  }

  document.querySelectorAll("form.neu").forEach(f => f.addEventListener("submit", async e => {
    e.preventDefault();
    const feld = f.querySelector("input"), titel = feld.value.trim();
    if (!titel || !schreiben) return;
    feld.value = "";
    try { const neu = await rpc("asmus_neu", { p_art: f.dataset.art, p_titel: titel }); if (neu) { eintraege.push(neu); render(); } }
    catch (err) { feld.value = titel; fehler(err); }
  }));

  async function speichern(id, daten) {
    try { await rpc("asmus_aendern", { p_id: id, p_daten: daten }); }
    catch (e) { fehler(e); laden(); }
  }

  function fehler(e) {
    if (e && e.falscherCode) { abmelden(); return; }
    hinweis("Speichern hat nicht geklappt. Bitte Internetverbindung prüfen und nochmal versuchen.");
    setTimeout(() => hinweis(""), 5000);
  }

  async function laden() {
    if (!code || editiert) return;
    try { eintraege = await rpc("asmus_liste") || []; hinweis(""); render(); }
    catch (e) {
      if (e.falscherCode) { abmelden(); return; }
      if (e.status === 404) hinweis("Die Liste ist noch nicht eingerichtet (Datenbank-Update fehlt).");
      else hinweis("Die Liste ist gerade nicht erreichbar. Sie lädt automatisch neu.");
    }
  }

  // Code-Abfrage
  const tor = document.getElementById("tor"), torForm = document.getElementById("tor-form"), torFeld = document.getElementById("tor-code"), torFehler = document.getElementById("tor-fehler");
  function abmelden() {
    code = ""; try { localStorage.removeItem("asmus-code"); } catch (e) {}
    tor.hidden = false; torFeld.value = ""; torFeld.focus();
  }
  torForm.addEventListener("submit", async e => {
    e.preventDefault();
    code = torFeld.value.trim(); if (!code) return;
    try {
      eintraege = await rpc("asmus_liste") || [];
      try { localStorage.setItem("asmus-code", code); } catch (e2) {}
      tor.hidden = true; torFehler.hidden = true; render();
    } catch (err) {
      torFehler.textContent = err.falscherCode ? "Falscher Code." : "Die Liste ist gerade nicht erreichbar.";
      torFehler.hidden = false; code = "";
    }
  });

  try { code = localStorage.getItem("asmus-code") || ""; } catch (e) {}
  if (code) { tor.hidden = true; laden(); } else { tor.hidden = false; }
  setInterval(() => { if (!document.hidden) laden(); }, 15000);
  document.addEventListener("visibilitychange", () => { if (!document.hidden) laden(); });
})();
</script>

</body>
</html>
